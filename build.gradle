plugins {
	// NOTE: the id "net.fabricmc.fabric-loom" currently resolves to a "no remap" marker
	// plugin in this Loom release that collides with the real plugin's own internal
	// hasPlugin("net.fabricmc.fabric-loom") check, silently disabling obfuscation/remapping
	// for every project that applies Loom the normal documented way. Applying under the
	// short id "fabric-loom" instead routes straight to the real LoomGradlePlugin.
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Cobblemon is not published to a dedicated maven, but every Modrinth project is
	// automatically available through Modrinth's generic maven proxy.
	// See gradle.properties for how to find the version id when updating Cobblemon.
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"cobblebeacon" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Gradle 9's stricter configuration roles mean Loom's "mappings"/"modCompileOnly"
	// configurations (registered RESOLVABLE-only) no longer get an auto-generated
	// `name "dep"` DSL method, so we call the low-level add(...) API instead.
	add("mappings", "net.fabricmc:yarn:${project.yarn_mappings}:v2")
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Loom is supposed to expose Mixin's annotations (org.spongepowered.asm.mixin.*) on the
	// compile classpath automatically as one of fabric-loader's own dependencies, but that
	// wiring hits the same Gradle 9 configuration-role issue as "mappings"/"modCompileOnly"
	// above, so it's added explicitly here. compileOnly is correct: the real implementation
	// always comes from fabric-loader at runtime, this must never be bundled into our jar.
	compileOnly "net.fabricmc:sponge-mixin:${project.sponge_mixin_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// The umbrella fabric-api artifact above doesn't get this particular submodule remapped
	// to our mappings on its own (its classes stayed in intermediary form, e.g.
	// ServerCommandSource showing up as "class_2168"), so it's pinned and pulled in explicitly
	// through Loom's mod-aware configuration instead. Version must stay in lockstep with
	// whatever fabric-command-api-v2 build the pinned fabric_api_version bundles - find the
	// current one by printing configurations.compileClasspath's resolved artifacts and
	// looking for "fabric-command-api-v2" if this ever needs bumping.
	add("modImplementation", "net.fabricmc.fabric-api:fabric-command-api-v2:2.2.28+6ced4dd919")

	// Cobblemon: compileOnly, we only touch its public event API (CobblemonEvents),
	// never bundle it. It's a required dependency at runtime (see fabric.mod.json),
	// so the actual mod jar on the server provides the implementation.
	add("modCompileOnly", "maven.modrinth:cobblemon:${project.cobblemon_modrinth_version_id}")
	// Cobblemon's public event API is Kotlin (e.g. CobblemonEvents.SHINY_CHANCE_CALCULATION's
	// Java-friendly subscribe(Consumer<T>) still resolves through Kotlin function-type
	// interfaces in its signature), so the Kotlin stdlib needs to be resolvable at compile
	// time even though we only call it from Java. fabric-language-kotlin provides the actual
	// runtime copy; this is compileOnly so it isn't duplicated into our jar.
	compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_stdlib_version}"

	// Cobbleworkers and Cobbreeding are intentionally NOT compile dependencies:
	// - Cobbleworkers is integrated purely through reflection (no public API/maven).
	// - Cobbreeding's egg timer is integrated through a generic data-component
	//   registry lookup, and its shiny roll through Cobblemon's own HATCH_EGG_PRE event.
	// This keeps the build reproducible without vendoring foreign jars, and keeps
	// both integrations from hard-breaking this project if those mods change internals.
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
